# Graph name
graph.graphname=trustgraph

# Cassandra Storage Backend Configuration
# Using CQL (Cassandra Query Language) backend
storage.backend=cql
storage.hostname=cassandra
storage.port=9042
storage.cql.keyspace=trustgraph
storage.cql.local-datacenter=datacenter1
storage.cql.replication-factor=1
storage.cql.cluster-name=TrustGraphCluster

# SINGLE NODE Cassandra → must be ONE
storage.cql.read-consistency-level=ONE
storage.cql.write-consistency-level=ONE

# Connection pool settings
storage.connection-timeout=10000
storage.cql.max-connections-per-host=32

# Elasticsearch Index Backend Configuration
# Client-only mode - JanusGraph acts as ES client, doesn't join cluster
index.search.backend=elasticsearch
index.search.hostname=elasticsearch
index.search.port=9200
index.search.elasticsearch.client-only=true
index.search.index-name=trustgraph

# Cache Configuration
cache.db-cache=true
cache.db-cache-time=180000
cache.db-cache-size=0.5

# Schema Configuration
schema.default=none

# Performance tuning
ids.authority.wait-time=300
ids.renew-timeout=120000

# Logging
log.tx.ignore-duplicates=true
