# Graph name
graph.graphname=trustgraph

# Cassandra backend
storage.backend=cql
storage.hostname=cassandra
storage.port=9042
storage.cql.keyspace=trustgraph
storage.cql.local-datacenter=datacenter1
storage.cql.replication-factor=1
storage.cql.cluster-name=TrustGraphCluster

# SINGLE NODE Cassandra → must be ONE
storage.cql.read-consistency-level=ONE
storage.cql.write-consistency-level=ONE

# Elasticsearch index
index.search.backend=elasticsearch
index.search.hostname=elasticsearch
index.search.port=9200
index.search.elasticsearch.client-only=true

# Cache
cache.db-cache=true
cache.db-cache-time=180000
cache.db-cache-size=0.5

# Schema
schema.default=none
